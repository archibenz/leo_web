spring:
  datasource:
    # JSONB is a PostgreSQL type H2 does not know; the domain lets H2 accept the
    # jsonb column definitions in the schema Hibernate generates via ddl-auto.
    # NON_KEYWORDS=KEY,VALUE: у site_config колонки key и value — в PostgreSQL
    # это обычные имена, в H2 зарезервированные слова. Без этого таблица в
    # тестах не читалась вовсе (найдено 24.09, первыми её тронули соцсети).
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-jwt-secret-key-minimum-32-characters-long-for-hmac
    expiration-ms: 86400000
  bot:
    api-secret: test-bot-secret
    username: test_bot
  pricing:
    intake-secret: test-pricing-secret
  # Боевое значение 10/мин честно срезает набор тестов: один только класс
  # MarketplacePriceIntakeControllerTest бьёт в ручку 14 раз, и все обращения
  # идут с одного адреса. Планка поднята здесь, а НЕ в боевом коде: менять
  # защиту под удобство проверки — это чинить не то. Что сторож действительно
  # срабатывает, доказывает отдельный тест со своей низкой планкой.
  rate-limit:
    integrations-per-minute: 1000
  resend:
    api-key: "DO-NOT-USE-test-resend-api-key"
    from: "test@test.com"
  upload:
    dir: /tmp/test-uploads
  metrics:
    secret: test-metrics-secret
  telegram:
    bot-token: test-bot-token
yookassa:
  shop-id: test-shop-id
  secret-key: test-secret-key
  enabled: false
  return-url-base: http://localhost:3000
