server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
spring:
  application:
    name: reinasleo-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: reinasleo-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # 64 МБ — ровно столько же, сколько client_max_body_size в nginx. Если
  # половины разойдутся, отказ придёт с разных уровней разными словами, и
  # владелец не поймёт, что произошло. Это НЕ разрешение класть на витрину
  # 64 МБ: видео режется на 8 МБ в FileUploadController, с понятным текстом.
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: reinasleo-api
app:
  resend:
    api-key: ${RESEND_API_KEY}
    from: ${RESEND_FROM}
  cors:
    allowed-origins: ${CORS_ORIGIN}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  bot:
    api-secret: ${BOT_API_SECRET}
    username: ${BOT_USERNAME}
  pricing:
    intake-secret: ${PRICING_INTAKE_SECRET}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  metrics:
    secret: ${METRICS_SECRET}
  # Сброс кэша данных Next после публикации витрины. Пустые фолбэки — то же
  # осознанное исключение, что и у yookassa ниже: без них API не стартует ни в
  # CI, ни на машине разработчика, а публикация без сброса не ломается — правка
  # доедет до покупателя сама, просто не за минуту, а за пятнадцать. Незаданный
  # секрет пишется в лог предупреждением при каждой публикации.
  web:
    revalidate-url: ${WEB_REVALIDATE_URL:}
    revalidate-secret: ${REVALIDATE_SECRET:}
  # Дневные числа и заказы сайта → приём leo_analytics (SiteDailyPublisher,
  # SiteOrderPublisher). Пустые
  # фолбэки — то же исключение: не заданы — отправка выключена с
  # предупреждением в логе, API стартует. URL полный, с /api/v1/ingest.
  analytics:
    ingest-url: ${ANALYTICS_INGEST_URL:}
    ingest-secret: ${ANALYTICS_INGEST_SECRET:}
# Пустые фолбэки для shop-id/secret-key — осознанное исключение из правила
# «секреты без :default»: фича выключена по умолчанию и приложение обязано
# стартовать без YooKassa credentials. При CHECKOUT_ENABLED=true пустые
# credentials валят старт (fail-fast в YooKassaProperties).
yookassa:
  shop-id: ${YOOKASSA_SHOP_ID:}
  secret-key: ${YOOKASSA_SECRET_KEY:}
  enabled: ${CHECKOUT_ENABLED:false}
  return-url-base: ${PUBLIC_BASE_URL:https://reinasleo.com}
