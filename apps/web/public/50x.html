<!doctype html>

<title>REINASLEO — пауза за кулисами</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; color: #1c1714; text-align: center; padding: 24px;
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  .figure { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 16px); }
  .digit { font-weight: 300; font-size: clamp(88px, 20vw, 150px); line-height: 1; letter-spacing: -0.02em; }
  .gem { width: clamp(44px, 9vw, 74px); height: auto; animation: turn 18s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .gem { animation: none; } }
  @keyframes turn { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .eyebrow { margin-top: 34px; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #776e64; }
  h1 { margin-top: 14px; font-weight: 300; font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.01em; }
  p { margin-top: 20px; max-width: 420px; font-size: 15px; line-height: 1.6; color: #776e64; }
  a { display: inline-block; margin-top: 36px; padding: 15px 34px; border: 1px solid #1c1714; color: #1c1714;
      text-decoration: none; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
  a:hover { background: #1c1714; color: #fff; }
  .en { margin-top: 28px; font-size: 12px; color: #a39a8f; }
</style>
</head>
<body>
  <div class="figure" aria-hidden="true">

    <span class="digit">X</span>
  </div>
  <p class="eyebrow">Сервис недоступен</p>
  <h1>Небольшая пауза за кулисами</h1>
  <p>Мы обновляем сцену. Вернитесь через минуту — коллекция никуда не уходит.</p>
